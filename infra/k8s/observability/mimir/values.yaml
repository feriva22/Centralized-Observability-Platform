namespace: observability
environment: sandbox

mimir-distributed:
  image:
    tag: "3.1.4"
  mimir:
    structuredConfig:
      common:
        storage:
          backend: s3
          s3:
            endpoint: obs-minio.observability.svc.cluster.local:9000
            region: us-east-1
            access_key_id: admin
            secret_access_key: ""
            insecure: true
      blocks_storage:
        s3:
          bucket_name: mimir-blocks
      alertmanager_storage:
        s3:
          bucket_name: mimir-alertmanager
      ruler_storage:
        s3:
          bucket_name: mimir-ruler

      # Kafka-based ingest storage — uses existing Kafka deployment
      ingest_storage:
        enabled: true
        kafka:
          address: kafka-native.observability.svc.cluster.local:9092
          topic: observability.metrics
          auto_create_topic_enabled: true
          auto_create_topic_default_partitions: 100

      ingester:
        push_grpc_method_enabled: false

  alertmanager:
    enabled: true
    replicas: 1

  compactor:
    replicas: 1

  distributor:
    replicas: 1

  ingester:
    replicas: 2
    zoneAwareReplication:
      enabled: false

  querier:
    replicas: 1

  query_frontend:
    replicas: 1

  query_scheduler:
    replicas: 1

  ruler:
    enabled: true
    replicas: 1

  store_gateway:
    replicas: 1
    zoneAwareReplication:
      enabled: false

  minio:
    enabled: false

  # Disable bundled Kafka — using existing external Kafka
  kafka:
    enabled: false

  metaMonitoring:
    serviceMonitor:
      enabled: false
