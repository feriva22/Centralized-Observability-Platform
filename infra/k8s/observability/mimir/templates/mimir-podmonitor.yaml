apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: mimir-self-monitoring
  labels:
    app.kubernetes.io/name: mimir
    # release: kube-prometheus-stack # Ensures kube-prometheus-stack picks it up
spec:
  # 1. Match pods with label app.kubernetes.io/name=mimir
  selector:
    matchLabels:
      app.kubernetes.io/name: mimir

  # Optional: Allows searching across all namespaces or specific ones
  namespaceSelector:
    matchNames:
      - observability

  podMetricsEndpoints:
    - port: http-metrics
      path: /metrics
      interval: 15s
      
      # 2-6. Relabeling rules matching your Alloy config
      relabelings:
        # Map pod name
        - sourceLabels: [__meta_kubernetes_pod_name]
          targetLabel: pod
          action: replace

        # Explicit Namespace Label (Required for cortex_build_info)
        - sourceLabels: [__meta_kubernetes_namespace]
          targetLabel: namespace
          action: replace

        # Map the Component (distributor, ingester, etc.)
        - sourceLabels: [__meta_kubernetes_pod_label_app_kubernetes_io_component]
          targetLabel: component
          action: replace

        # Construct Job Label (<namespace>/<component>)
        - sourceLabels: [__meta_kubernetes_namespace, __meta_kubernetes_pod_label_app_kubernetes_io_component]
          separator: "/"
          targetLabel: job
          action: replace

        # Map the Zone (from pod labels)
        - sourceLabels: [__meta_kubernetes_pod_label_zone]
          targetLabel: zone
          action: replace