# =============================================================================
# OTel Collector — DaemonSet (Node Agent)
# Role: Per-node collection of:
#   - Container logs (filelog receiver → /var/log/pods)
#   - Host-level metrics (hostmetrics receiver)
#   - OTLP signals from app pods (otlp receiver)
# All signals forwarded to the Gateway Deployment via OTLP/gRPC
# =============================================================================
otel-daemonset:
  mode: daemonset

  # -- Image
  image:
    repository: otel/opentelemetry-collector-contrib
    tag: "0.153.0"
    pullPolicy: IfNotPresent

  # -- RBAC — needed for k8sattributes to enrich logs/traces with pod metadata
  clusterRole:
    create: true
    rules:
      - apiGroups: [""]
        resources:
          - nodes
          - nodes/proxy
          - nodes/stats
          - nodes/metrics
          - pods
          - namespaces
          - services
          - endpoints
        verbs: ["get", "list", "watch"]
      # kubeletstats needs access to /stats/summary on each node
      - nonResourceURLs:
          - /metrics
          - /metrics/cadvisor
          - /stats/summary
        verbs: ["get"]

  serviceAccount:
    create: true

  # -- Tolerations — ensure DaemonSet runs on ALL nodes including control-plane
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
    - key: node-role.kubernetes.io/master
      operator: Exists
      effect: NoSchedule

  # -- Expose OTLP ports so app pods can push traces/logs directly to node-local collector
  ports:
    otlp:
      enabled: true
      containerPort: 4317
      servicePort: 4317
      hostPort: 4317
      protocol: TCP
    otlp-http:
      enabled: true
      containerPort: 4318
      servicePort: 4318
      hostPort: 4318
      protocol: TCP
    metrics:
      enabled: true
      containerPort: 8888
      servicePort: 8888
      protocol: TCP

  # -- Resource limits — important for DaemonSet to avoid node pressure
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
    limits:
      cpu: 500m
      memory: 500Mi

  # -- Run as root — required for reading /var/log/pods and writing /var/lib/otelcol
  securityContext:
    runAsUser: 0
    runAsGroup: 0

  # -- Collector config
  config:
    extensions:
      health_check:
        endpoint: "0.0.0.0:13133"
      # Stores file offsets so log tailing survives pod restarts
      file_storage:
        directory: /var/lib/otelcol
        timeout: 10s

    receivers:
      # -----------------------------------------------------------------------
      # 1. OTLP — receives traces/metrics/logs pushed directly from app pods
      #    Bound to 0.0.0.0 so pods can reach via hostPort or pod IP
      # -----------------------------------------------------------------------
      otlp:
        protocols:
          grpc:
            endpoint: "0.0.0.0:4317"
          http:
            endpoint: "0.0.0.0:4318"

      # -----------------------------------------------------------------------
      # 2. filelog — tails container logs from /var/log/pods
      #    Scoped to namespaces: ipos5-dev, default
      #    Parses CRI-O / containerd log format
      # -----------------------------------------------------------------------
      file_log:
        include:
          - /var/log/pods/*/*/*.log
        exclude:
          # Exclude the collector's own logs to avoid feedback loop
          - /var/log/pods/monitoring_otel-daemonset*/*/*.log
        start_at: beginning
        include_file_path: true
        include_file_name: false
        # Use file_storage extension to persist read offsets
        storage: file_storage

        operators:
          # Parse CRI-O / containerd log format: timestamp stream flags message
          - type: container
            id: container-parser
            max_log_size: 102400

          # Promote log severity from log body if structured JSON
          - type: json_parser
            id: json-body-parser
            if: 'body matches "^\\{"'
            parse_from: body
            parse_to: attributes
            on_error: send

          - type: severity_parser
            if: 'attributes["level"] != nil'
            parse_from: attributes["level"]

      # -----------------------------------------------------------------------
      # 3. hostmetrics — node-level system metrics (CPU, memory, disk, network)
      #    OTel-native replacement for node-exporter
      #    Runs once per node since this is a DaemonSet
      # -----------------------------------------------------------------------
      host_metrics:
        collection_interval: 60s
        root_path: /
        scrapers:
          cpu:
            metrics:
              system.cpu.utilization:
                enabled: true
          memory:
            metrics:
              system.memory.utilization:
                enabled: true
          disk: {}
          filesystem:
            exclude_mount_points:
              mount_points: ["/dev/*", "/proc/*", "/sys/*", "/run/k3s/containerd/*", "/var/lib/docker/*", "/var/lib/kubelet/*", "/snap/*"]
              match_type: regexp
            exclude_fs_types:
              fs_types: [autofs, binfmt_misc, bpf, cgroup2, configfs, debugfs, devpts, devtmpfs, fusectl, hugetlbfs, iso9660, mqueue, nsfs, overlay, proc, procfs, pstore, rpc_pipefs, securityfs, selinuxfs, squashfs, sysfs, tracefs]
              match_type: strict
          network: {}
          load: {}
          processes: {}
          paging: {}

      # -----------------------------------------------------------------------
      # 4. kubeletstats — container + pod + node metrics from kubelet API
      #    OTel-native replacement for cAdvisor / kubelet Prometheus scraping
      #    Uses serviceAccount auth — auto-resolves node kubelet via k8s API
      #    (avoids DNS lookup issues on cloud providers like Alibaba ACK)
      # -----------------------------------------------------------------------
      kubelet_stats:
        collection_interval: 60s
        auth_type: serviceAccount
        # Use node IP from downward API instead of hostname to avoid DNS issues
        # on Alibaba ACK where node names are IPs (e.g. ap-southeast-5.x.x.x)
        endpoint: "https://${env:KUBE_NODE_IP}:10250"
        insecure_skip_verify: true
        extra_metadata_labels:
          - container.id
          - k8s.volume.type
        metric_groups:
          - node
          - pod
          - container
          - volume
        metrics:
          k8s.container.cpu_limit_utilization:
            enabled: true
          k8s.container.memory_limit_utilization:
            enabled: true
          k8s.pod.cpu_limit_utilization:
            enabled: true
          k8s.pod.memory_limit_utilization:
            enabled: true
          k8s.node.uptime:
            enabled: true

      # -----------------------------------------------------------------------
      # 5. prometheus — scrape ztunnel on same node using nodeName filter
      #    ztunnel uses hostNetwork → __address__ resolves to node IP.
      #    Relabel forces port 15020 (ztunnel metrics port).
      # -----------------------------------------------------------------------
      prometheus:
        config:
          scrape_configs:
            - job_name: istio-ztunnel-node
              scrape_interval: 15s
              kubernetes_sd_configs:
                - role: pod
                  selectors:
                    - role: pod
                      field: "spec.nodeName=${env:KUBE_NODE_NAME}"
              relabel_configs:
                # Keep only ztunnel pods
                - source_labels: [__meta_kubernetes_pod_label_app]
                  action: keep
                  regex: ztunnel
                # Point to ztunnel metrics port 15020
                - source_labels: [__address__]
                  action: replace
                  regex: ([^:]+)(?::\d+)?
                  replacement: $1:15020
                  target_label: __address__

    processors:
      # -- Protect against OOM on node
      memory_limiter:
        check_interval: 5s
        limit_percentage: 75
        spike_limit_percentage: 20

      # -- Enrich all signals with k8s pod/namespace/node metadata
      k8s_attributes:
        auth_type: serviceAccount
        passthrough: false
        # Read pod metadata from the node this DaemonSet pod runs on
        filter:
          node_from_env_var: KUBE_NODE_NAME
        extract:
          metadata:
            - k8s.pod.name
            - k8s.pod.uid
            - k8s.deployment.name
            - k8s.namespace.name
            - k8s.node.name
            - k8s.pod.start_time
          labels:
            - tag_name: app
              key: app.kubernetes.io/name
              from: pod
            - tag_name: version
              key: app.kubernetes.io/version
              from: pod
        pod_association:
          - sources:
              - from: resource_attribute
                name: k8s.pod.ip
          - sources:
              - from: resource_attribute
                name: k8s.pod.uid
          - sources:
              - from: connection

      # -- Attach static resource attributes to all signals
      resource:
        attributes:
          - key: cluster
            value: "SANDBOX-cluster"
            action: upsert
          - key: cloud
            value: "local"
            action: upsert
          - key: environment
            value: "development"
            action: upsert
          - key: region
            value: "ap-southeast-3"
            action: upsert
          - key: collector
            value: "otel-contrib"
            action: upsert
          - key: collector.component
            value: "daemonset"
            action: upsert
      resource_detection:
        detectors: [env, system, k8snode]
        timeout: 10s
        override: false
        system:
          hostname_sources: [os]
        k8snode:
          node_from_env_var: KUBE_NODE_NAME

      # -- Batch before forwarding to Gateway
      batch:
        send_batch_size: 1000
        send_batch_max_size: 1500
        timeout: 5s

    exporters:
      # -----------------------------------------------------------------------
      # Forward ALL signals to the Gateway Deployment via OTLP/gRPC
      # Service name: otel-gateway (resolves via ClusterIP service)
      # -----------------------------------------------------------------------
      otlp_grpc/gateway:
        endpoint: "agent-monitoring-otel-gateway.observability.svc.cluster.local:4317"
        tls:
          insecure: true
        sending_queue:
          enabled: true
          num_consumers: 4
          queue_size: 1000
        retry_on_failure:
          enabled: true
          initial_interval: 5s
          max_interval: 30s
          max_elapsed_time: 300s

      # -- Debug exporter (disable in production)
      debug:
        verbosity: basic

    service:
      extensions: [health_check, file_storage]
      pipelines:
        # Logs: file_log → enrich → batch → gateway
        # logs:
        #   receivers: [file_log, otlp]
        #   processors: [memory_limiter, k8s_attributes, resource, batch]
        #   exporters: [debug]

        # Metrics: host_metrics (node) + kubelet_stats (container/pod) + prometheus (ztunnel) + OTLP from app pods → enrich → batch → gateway
        metrics:
          receivers: [host_metrics, kubelet_stats, prometheus, otlp]
          processors: [memory_limiter, resource_detection, resource, batch]
          exporters: [otlp_grpc/gateway, debug]

        # Traces: OTLP from app pods → enrich → batch → gateway
        #traces:
        #  receivers: [otlp]
        #  processors: [memory_limiter, k8s_attributes, resource, batch]
        #  exporters: [debug]

  # -- Expose KUBE_NODE_NAME and KUBE_NODE_IP env vars for k8sattributes + kubeletstats
  extraEnvs:
    - name: KUBE_NODE_NAME
      valueFrom:
        fieldRef:
          apiVersion: v1
          fieldPath: spec.nodeName
    - name: KUBE_NODE_IP
      valueFrom:
        fieldRef:
          apiVersion: v1
          fieldPath: status.hostIP

  # -- Additional volume for file_storage extension (persist log offsets)
  extraVolumes:
    - name: varlogpods
      hostPath:
        path: /var/log/pods
    - name: varlibdockercontainers
      hostPath:
        path: /var/lib/docker/containers
    - name: otelcol-storage
      hostPath:
        path: /var/lib/otelcol
        type: DirectoryOrCreate

  extraVolumeMounts:
    - name: varlogpods
      mountPath: /var/log/pods
      readOnly: true
    - name: varlibdockercontainers
      mountPath: /var/lib/docker/containers
      readOnly: true
    - name: otelcol-storage
      mountPath: /var/lib/otelcol
