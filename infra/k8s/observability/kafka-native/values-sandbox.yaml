# Sandbox overrides — lightweight single node
environment: sandbox

replicas: 3

persistence:
  enabled: true
  size: 10Gi
  storageClassName: ""

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 2000m
    memory: 2Gi

logRetentionHours: 24

kafkaExporter:
  enabled: true

podDisruptionBudget:
  maxUnavailable: 1

nodeSelector: {}
tolerations: []
affinity: {}

priorityClassName: null
podLabels: {}
podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "9404"
  prometheus.io/path: /metrics
