{{- $replicas := .Values.replicas | default 1 -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "kafka-native.fullname" . }}
  labels:
    {{- include "kafka-native.labels" . | nindent 4 }}
  annotations:
    {{- toYaml .Values.podAnnotations | nindent 4 }}
  namespace: {{ .Release.Namespace | quote }}
spec:
  podManagementPolicy: Parallel
  replicas: {{ $replicas }}
  selector:
    matchLabels:
      {{- include "kafka-native.selectorLabels" . | nindent 6 }}
  serviceName: {{ include "kafka-native.fullname" . }}-headless
  template:
    metadata:
      labels:
        {{- include "kafka-native.podLabels" . | nindent 8 }}
      annotations:
        {{- toYaml .Values.podAnnotations | nindent 8 }}
      namespace: {{ .Release.Namespace | quote }}
    spec:
      serviceAccountName: {{ include "kafka-native.fullname" . }}
      {{- if .Values.priorityClassName }}
      priorityClassName: {{ .Values.priorityClassName }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.dnsConfig }}
      dnsConfig:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: kafka
          image: {{ .Values.image.registry }}/{{ .Values.image.repository }}:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 9092
              name: kafka
              protocol: TCP
            - containerPort: 9093
              name: controller
              protocol: TCP
            {{- if .Values.jmx.enabled }}
            - containerPort: {{ .Values.service.jmxPort }}
              name: jmx
              protocol: TCP
            {{- end }}
          {{- $kafkaName     := include "kafka-native.fullname" . -}}
          {{- $clusterDomain := "cluster.local" -}}
          {{- if and .Values.global .Values.global.clusterDomain -}}
          {{-   $clusterDomain = .Values.global.clusterDomain -}}
          {{- end -}}
          {{- $namespace     := .Release.Namespace -}}
          {{- $quorumVoters  := list -}}
          {{- range $i := until (int $replicas) -}}
            {{- $quorumVoters = append $quorumVoters (printf "%d@%s-%d.%s-headless.%s.svc.%s:9093" $i $kafkaName $i $kafkaName $namespace (trimSuffix "." $clusterDomain)) -}}
          {{- end -}}
          {{- $defaultEnv := list
              (dict "name" "_POD_NAME" "valueFrom" (dict "fieldRef" (dict "fieldPath" "metadata.name")))
              (dict "name" "KAFKA_CLUSTER_ID" "value" (.Values.clusterId | default ""))
              (dict "name" "KAFKA_NODE_ID" "valueFrom" (dict "fieldRef" (dict "fieldPath" "metadata.labels['apps.kubernetes.io/pod-index']")))
              (dict "name" "KAFKA_PROCESS_ROLES" "value" "broker,controller")
              (dict "name" "KAFKA_LISTENERS" "value" "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093")
              (dict "name" "KAFKA_ADVERTISED_LISTENERS" "value" (printf "PLAINTEXT://$(_POD_NAME).%s-headless.%s.svc.%s:9092" $kafkaName $namespace $clusterDomain))
              (dict "name" "KAFKA_CONTROLLER_QUORUM_VOTERS" "value" (join "," $quorumVoters))
              (dict "name" "KAFKA_CONTROLLER_LISTENER_NAMES" "value" "CONTROLLER")
              (dict "name" "KAFKA_INTER_BROKER_LISTENER_NAME" "value" "PLAINTEXT")
              (dict "name" "KAFKA_LOG_DIRS" "value" "/var/lib/kafka/data")
              (dict "name" "KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR" "value" (min 3 $replicas | toString))
              (dict "name" "KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR" "value" (min 3 $replicas | toString))
              (dict "name" "KAFKA_TRANSACTION_STATE_LOG_MIN_ISR" "value" (min 2 $replicas | toString))
              (dict "name" "KAFKA_LOG_RETENTION_HOURS" "value" (.Values.logRetentionHours | default 24 | toString))
              (dict "name" "JMX_PORT" "value" (.Values.service.jmxPort | toString))
          -}}
          {{- include "kafka-native.containerEnv" (dict "ctx" $ "env" $defaultEnv) | nindent 10 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          volumeMounts:
            - name: kafka-data
              mountPath: /var/lib/kafka
            - name: kafka-config
              mountPath: /opt/kafka/config
            - name: tmp
              mountPath: /tmp
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          readinessProbe:
            tcpSocket:
              port: kafka
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
        {{- if .Values.jmx.enabled }}
        - name: jmx-exporter
          image: {{ .Values.jmx.exporterImage }}:{{ .Values.jmx.exporterVersion }}
          args:
            - "{{ .Values.service.metricsPort }}"
            - /etc/jmx-exporter/jmx-exporter-config.yaml
          ports:
            - containerPort: {{ .Values.service.metricsPort }}
              name: metrics
              protocol: TCP
          volumeMounts:
            - name: jmx-exporter-config
              mountPath: /etc/jmx-exporter
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
            capabilities:
              drop: [ALL]
            allowPrivilegeEscalation: false
        {{- end }}
      volumes:
        - name: kafka-config
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        {{- if .Values.jmx.enabled }}
        - name: jmx-exporter-config
          configMap:
            name: {{ include "kafka-native.fullname" . }}-jmx-exporter
        {{- end }}
        {{- if not .Values.persistence.enabled }}
        - name: kafka-data
          emptyDir: {}
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
  {{- if .Values.persistence.enabled }}
  volumeClaimTemplates:
    - apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: kafka-data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.persistence.storageClassName }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
  {{- end }}
