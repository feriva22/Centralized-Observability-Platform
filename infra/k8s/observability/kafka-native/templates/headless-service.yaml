apiVersion: v1
kind: Service
metadata:
  name: {{ include "kafka-native.fullname" . }}-headless
  labels:
    {{- include "kafka-native.labels" . | nindent 4 }}
    prometheus.io/service-monitor: "false"
    {{- with .Values.service.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  annotations:
    {{- with .Values.service.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  namespace: {{ .Release.Namespace | quote }}
spec:
  type: ClusterIP
  publishNotReadyAddresses: true
  clusterIP: None
  ports:
    - port: {{ .Values.service.port }}
      protocol: TCP
      name: kafka
      targetPort: kafka
    - port: {{ .Values.service.controllerPort }}
      protocol: TCP
      name: controller
      targetPort: controller
  selector:
    {{- include "kafka-native.selectorLabels" . | nindent 4 }}
