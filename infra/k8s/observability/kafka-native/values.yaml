replicas: 1

image:
  registry: docker.io
  repository: apache/kafka-native
  tag: 4.3.1
  pullPolicy: IfNotPresent

service:
  port: 9092
  controllerPort: 9093
  metricsPort: 9404
  jmxPort: 9999
  type: ClusterIP
  annotations: {}
  labels: {}

jmx:
  enabled: true
  port: 9999
  exporterPort: 9404
  exporterImage: prom/jmx-exporter
  exporterVersion: "1.0.1"
  config:
    # Kafka JMX exporter rules — scrape common broker MBeans
    startDelaySeconds: 10
    jmxUrl: "service:jmx:rmi:///jndi/rmi://localhost:9999/jmxrmi"
    ssl: false
    whitelistObjectNames:
      - "kafka.controller:*"
      - "kafka.server:*"
      - "kafka.network:*"
      - "kafka.log:*"
    rules:
      - pattern: "kafka.controller<type=(.+), name=(.+)><>(Count|Value|Mean|Rate)"
        name: "kafka_controller_$1_$2"
        type: GAUGE
      - pattern: "kafka.server<type=(.+), name=(.+), topic=(.+)><>(Count|OneMinuteRate|MeanRate)"
        name: "kafka_server_$1_$2"
        type: GAUGE
        labels:
          topic: "$3"
      - pattern: "kafka.server<type=(.+), name=(.+)><>(Count|Value|Mean|Rate)"
        name: "kafka_server_$1_$2"
        type: GAUGE
      - pattern: "kafka.network<type=(.+), name=(.+)><>(Count|Value|Mean|Rate)"
        name: "kafka_network_$1_$2"
        type: GAUGE
      - pattern: "kafka.log<type=(.+), name=(.+), topic=(.+), partition=(.+)><>(Count|Value|Mean|Rate)"
        name: "kafka_log_$1_$2"
        type: GAUGE
        labels:
          topic: "$3"
          partition: "$4"
      - pattern: "kafka.log<type=(.+), name=(.+)><>(Count|Value|Mean|Rate)"
        name: "kafka_log_$1_$2"
        type: GAUGE

persistence:
  enabled: true
  size: 20Gi
  storageClassName: ""

resources:
  requests:
    cpu: 2
    memory: 2Gi
  limits: {}

dnsConfig: {}
nodeSelector: {}
tolerations: []
affinity: {}

podDisruptionBudget:
  maxUnavailable: 1

priorityClassName: null
podLabels: {}
podAnnotations: {}

securityContext:
  fsGroup: 1001
  runAsGroup: 1001
  runAsNonRoot: true
  runAsUser: 1001
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]
  allowPrivilegeEscalation: false

terminationGracePeriodSeconds: 30
logRetentionHours: 72

env: []
extraEnvFrom: []
extraVolumes: []
extraVolumeMounts: []
