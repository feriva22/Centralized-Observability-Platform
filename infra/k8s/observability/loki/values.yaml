namespace: observability
environment: sandbox

loki:
  loki:
    auth_enabled: false
    commonConfig:
      replication_factor: 1
    storage:
      type: s3
      s3:
        endpoint: obs-minio.observability.svc.cluster.local:9000
        region: us-east-1
        bucketnames: loki-chunks
        access_key_id: admin
        secret_access_key: ""
        insecure: true
        s3forcepathstyle: true
    schemaConfig:
      configs:
        - from: "2024-01-01"
          store: tsdb
          object_store: s3
          schema: v13
          index:
            prefix: loki_index_
            period: 24h

  deploymentMode: SingleBinary

  singleBinary:
    replicas: 1
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

  gateway:
    enabled: true

  monitoring:
    selfMonitoring:
      enabled: false
    lokiCanary:
      enabled: false
