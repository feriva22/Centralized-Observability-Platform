environment: production

loki:
  deploymentMode: SimpleScalable

  backend:
    replicas: 3
  read:
    replicas: 3
  write:
    replicas: 3

  loki:
    commonConfig:
      replication_factor: 3

  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi
