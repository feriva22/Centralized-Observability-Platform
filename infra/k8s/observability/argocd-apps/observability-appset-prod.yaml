apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: observability-prod
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - component: minio
          - component: kafka
          - component: loki
          - component: tempo
          - component: mimir
          - component: grafana
  template:
    metadata:
      name: "obs-prod-{{component}}"
      labels:
        app.kubernetes.io/part-of: observability
        environment: production
    spec:
      project: default
      source:
        repoURL: https://github.com/your-org/infra
        targetRevision: HEAD
        path: "infra/k8s/observability/{{component}}"
        helm:
          valueFiles:
            - values.yaml
            - values-prod.yaml
      destination:
        server: https://prod-cluster-api.your-domain.com   # prod cluster API
        namespace: observability
      syncPolicy:
        automated:
          prune: false   # manual prune on prod for safety
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
