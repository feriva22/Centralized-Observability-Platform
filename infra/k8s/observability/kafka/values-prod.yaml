# Production overrides — high availability
environment: production

replicaCount: 3

heapOpts: "-Xmx1g -Xms512m"

persistence:
  enabled: true
  size: 100Gi
  storageClass: "fast-ssd"

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: 2000m
    memory: 2Gi

kafkaConfig:
  logRetentionHours: 168

podDisruptionBudget:
  enabled: true
