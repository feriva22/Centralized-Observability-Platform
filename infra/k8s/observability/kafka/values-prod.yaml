# Production overrides — high availability
environment: production

replicaCount: 3

storage:
  size: 100Gi
  storageClass: "fast-ssd"

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: 2000m
    memory: 2Gi

jvm:
  heapOpts: "-Xmx1g -Xms512m"
  performanceOpts: "-XX:+UseG1GC -XX:MaxGCPauseMillis=20 -XX:InitiatingHeapOccupancyPercent=35"

kafka:
  autoCreateTopics: false
  defaultReplicationFactor: 3
  minInsyncReplicas: 2
  logRetentionHours: 168
  logSegmentBytes: 1073741824

topics:
  - name: observability.logs
    partitions: 12
    replicationFactor: 3
    retentionMs: "604800000"
  - name: observability.traces
    partitions: 12
    replicationFactor: 3
    retentionMs: "604800000"
  - name: observability.metrics
    partitions: 12
    replicationFactor: 3
    retentionMs: "604800000"
