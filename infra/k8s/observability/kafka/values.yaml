namespace: observability
environment: sandbox

replicaCount: 3

clusterId: ""  # auto-generated on first run

image:
  registry: docker.io
  repository: apache/kafka
  tag: 4.3.1
  imagePullPolicy: IfNotPresent

heapOpts: "-Xmx512m -Xms256m"

persistence:
  enabled: true
  size: 20Gi
  storageClass: ""

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 1Gi

kafkaConfig:
  numPartitions: 6
  defaultReplicationFactor: 3
  offsetsTopicReplicationFactor: 3
  transactionStateLogReplicationFactor: 3
  transactionStateLogMinIsr: 2
  autoCreateTopicsEnable: true
  logRetentionHours: 168
  extraConfig:
    - "min.insync.replicas=2"
    - "log.segment.bytes=1073741824"
    - "log.retention.check.interval.ms=300000"

# Disable auth for internal observability traffic
auth:
  client:
    enabled: false
  interBroker:
    enabled: false
  controller:
    enabled: false

tls:
  enabled: false

service:
  type: ClusterIP

logging:
  consoleOnly: true
  level: INFO

metrics:
  enabled: false
  serviceMonitor:
    enabled: false

podDisruptionBudget:
  enabled: false

# Pre-created topics
extraObjects: []

