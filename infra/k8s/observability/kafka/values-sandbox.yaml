# Sandbox overrides — lightweight single node
replicaCount: 1

heapOpts: "-Xmx256m -Xms128m"

persistence:
  enabled: true
  size: 5Gi

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

kafkaConfig:
  logRetentionHours: 24

podDisruptionBudget:
  enabled: false
