# Sandbox overrides — lightweight single node
environment: sandbox

replicaCount: 1

storage:
  size: 5Gi
  storageClass: ""

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

jvm:
  heapOpts: "-Xmx256m -Xms128m"
  performanceOpts: "-XX:+UseG1GC"

kafka:
  autoCreateTopics: true
  defaultReplicationFactor: 1
  minInsyncReplicas: 1
  logRetentionHours: 24
  logSegmentBytes: 536870912

topics:
  - name: observability.logs
    partitions: 1
    replicationFactor: 1
    retentionMs: "86400000"
  - name: observability.traces
    partitions: 1
    replicationFactor: 1
    retentionMs: "86400000"
  - name: observability.metrics
    partitions: 1
    replicationFactor: 1
    retentionMs: "86400000"
