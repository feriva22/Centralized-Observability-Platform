apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: observability
  labels:
    app: kafka
spec:
  serviceName: kafka-headless
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: kafka
  podManagementPolicy: Parallel
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: kafka
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: kafka
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /bin/bash
            - -c
            - |
              export KAFKA_NODE_ID=${HOSTNAME##*-}

              # Format KRaft storage if not already formatted
              STORAGE_DIR=/var/kafka/data
              if [ ! -f "$STORAGE_DIR/meta.properties" ]; then
                echo "Formatting KRaft storage for node $KAFKA_NODE_ID..."
                /opt/kafka/bin/kafka-storage.sh format \
                  --config /opt/kafka/config/server.properties \
                  --cluster-id $(cat /etc/kafka-cluster-id/CLUSTER_ID) \
                  --node-id $KAFKA_NODE_ID \
                  --ignore-formatted
              fi

              exec /opt/kafka/bin/kafka-server-start.sh /opt/kafka/config/server.properties \
                --override node.id=$KAFKA_NODE_ID \
                --override advertised.listeners=PLAINTEXT://$(HOSTNAME).kafka-headless.observability.svc.cluster.local:9092
          env:
            - name: HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: KAFKA_HEAP_OPTS
              value: {{ .Values.jvm.heapOpts | quote }}
            - name: KAFKA_JVM_PERFORMANCE_OPTS
              value: {{ .Values.jvm.performanceOpts | quote }}
          ports:
            - name: broker
              containerPort: 9092
            - name: controller
              containerPort: 9093
          volumeMounts:
            - name: kafka-data
              mountPath: /var/kafka/data
            - name: kafka-config
              mountPath: /opt/kafka/config
            - name: cluster-id
              mountPath: /etc/kafka-cluster-id
          resources:
            requests:
              cpu: {{ .Values.resources.requests.cpu }}
              memory: {{ .Values.resources.requests.memory }}
            limits:
              cpu: {{ .Values.resources.limits.cpu }}
              memory: {{ .Values.resources.limits.memory }}
          readinessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
            failureThreshold: {{ .Values.readinessProbe.failureThreshold }}
          livenessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
            failureThreshold: {{ .Values.livenessProbe.failureThreshold }}

      volumes:
        - name: kafka-config
          configMap:
            name: kafka-config
            items:
              - key: server.properties
                path: server.properties
        - name: cluster-id
          secret:
            secretName: {{ .Values.clusterIdSecretName }}

  volumeClaimTemplates:
    - metadata:
        name: kafka-data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.storage.storageClass }}
        storageClassName: {{ .Values.storage.storageClass }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.storage.size }}
