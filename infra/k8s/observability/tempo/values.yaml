namespace: observability
environment: sandbox

tempo:
  tempo:
    reportingEnabled: false
    storage:
      trace:
        backend: s3
        s3:
          endpoint: obs-minio.observability.svc.cluster.local:9000
          region: us-east-1
          bucket: tempo-traces
          access_key: admin
          secret_key: ""
          insecure: true
          forcepathstyle: true
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: "0.0.0.0:4317"
          http:
            endpoint: "0.0.0.0:4318"
      jaeger:
        protocols:
          thrift_http:
            endpoint: "0.0.0.0:14268"

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  persistence:
    enabled: false

  serviceMonitor:
    enabled: false
