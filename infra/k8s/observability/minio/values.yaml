minio:
  replicaCount: 1

  auth:
    rootUser: admin
    rootPassword: ""
    existingSecret: ""
    existingSecretUserKey: user
    existingSecretPasswordKey: password

  defaultBuckets: "observability-k8s"

  persistence:
    enabled: true
    storageClass: ""
    size: 10Gi
    accessModes:
      - ReadWriteOnce

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  service:
    type: ClusterIP
    port: 9000
    consolePort: 9090

  config:
    region: us-east-1
    browserEnabled: true

  ingress:
    enabled: false

  consoleIngress:
    enabled: false

  livenessProbe:
    enabled: true
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

  readinessProbe:
    enabled: true
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
