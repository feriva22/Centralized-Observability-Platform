argo-cd:
  global:
    domain: argocd.your-domain.com

  configs:
    params:
      server.insecure: true   # set false if terminating TLS at ArgoCD level

    cm:
      application.resourceTrackingMethod: annotation
      resource.compareoptions: |
        ignoreAggregatedRoles: true

      # ── OIDC SSO Configuration ──
      # ArgoCD akan redirect ke Authelia (atau OAuth2-Proxy) untuk login
      # Sesuaikan clientID, clientSecret, dan issuer URL dengan environment
      url: https://argocd.your-domain.com
      oidc.config: |
        name: Authelia
        issuer: https://auth.example.com
        clientID: argocd
        clientSecret: ""
        requestedScopes: ["openid", "profile", "email", "groups"]
        requestedIDTokenClaims: {"groups": {"essential": true}}

    rbac:
      policy.default: role:readonly
      policy.csv: |
        p, role:admin, applications, *, */*, allow
        p, role:admin, clusters, get, *, allow
        p, role:admin, repositories, *, *, allow
        p, role:admin, logs, get, *, allow
        p, role:admin, exec, create, */*, allow
        g, argocd-admins, role:admin

      # ── Mapping OIDC groups/roles ke ArgoCD roles ──
      scopes: "[groups, email]"

  server:
    replicas: 1
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi

  controller:
    replicas: 1
    resources:
      requests:
        cpu: 250m
        memory: 256Mi
      limits:
        cpu: 1000m
        memory: 512Mi

  repoServer:
    replicas: 1
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi

  applicationSet:
    replicas: 1
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi

  notifications:
    enabled: false

  dex:
    enabled: false

  redis:
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi
