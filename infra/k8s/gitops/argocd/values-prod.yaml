# Production overrides
argo-cd:
  global:
    domain: argocd.your-domain.com

  configs:
    params:
      server.insecure: false

    cm:
      url: https://argocd.your-domain.com
      oidc.config: |
        name: Authelia
        issuer: https://auth.example.com
        clientID: argocd
        clientSecret: ""
        requestedScopes: ["openid", "profile", "email", "groups"]
        requestedIDTokenClaims: {"groups": {"essential": true}}

  server:
    replicas: 2
    resources:
      requests:
        cpu: 200m
        memory: 256Mi
      limits:
        cpu: 1000m
        memory: 512Mi

  controller:
    replicas: 1
    resources:
      requests:
        cpu: 500m
        memory: 512Mi
      limits:
        cpu: 2000m
        memory: 1Gi

  repoServer:
    replicas: 2
    resources:
      requests:
        cpu: 200m
        memory: 256Mi
      limits:
        cpu: 1000m
        memory: 512Mi

  applicationSet:
    replicas: 2
    resources:
      requests:
        cpu: 200m
        memory: 256Mi
      limits:
        cpu: 1000m
        memory: 512Mi

  notifications:
    enabled: true

  dex:
    enabled: false

  redis-ha:
    enabled: true
