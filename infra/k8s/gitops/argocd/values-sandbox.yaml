# Sandbox overrides
argo-cd:
  global:
    domain: argocd-sandbox.your-domain.com

  configs:
    params:
      server.insecure: true

    cm:
      url: https://argocd-sandbox.your-domain.com
      oidc.config: |
        name: Authelia
        issuer: https://auth.sandbox.example.com
        clientID: argocd
        clientSecret: ""
        requestedScopes: ["openid", "profile", "email", "groups"]
        requestedIDTokenClaims: {"groups": {"essential": true}}

  server:
    replicas: 1
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi

  controller:
    replicas: 1
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi

  repoServer:
    replicas: 1
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi

  applicationSet:
    replicas: 1
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi

  notifications:
    enabled: false

  dex:
    enabled: false
