namespace: authentication
environment: sandbox

authelia:
  # -- Pod configuration
  pod:
    kind: Deployment
    replicas: 1
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
    securityContext:
      pod: {}
      container: {}

  # -- Pod disruption budget (top-level key)
  podDisruptionBudget:
    enabled: false

  # -- Ingress configuration
  ingress:
    enabled: true
    className: ""
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
    tls:
      enabled: true
      secret: authelia-tls

  # -- Authelia configuration
  configMap:
    # -- Default policy: deny, bypass, one_factor, two_factor
    access_control:
      default_policy: deny
      rules:
        - domain: "auth.example.com"
          policy: one_factor

    # -- Session configuration
    session:
      name: authelia_session
      domain: example.com
      same_site: lax
      expiration: 1h
      inactivity: 5m
      remember_me: 1M
      cookies:
        - domain: example.com
          authelia_url: https://auth.example.com

    # -- Authentication backend: file-based (suitable for sandbox)
    authentication_backend:
      password_reset:
        disable: false
      password_change:
        disable: false
      file:
        enabled: true
        path: /config/users.yml
        watch: false
        search:
          case_insensitive: false
          email: false

    # -- Storage: local SQLite (suitable for sandbox, for prod use postgres/mysql)
    storage:
      local:
        enabled: true
        path: /config/db.sqlite3

    # -- Notifier: filesystem (suitable for sandbox, for prod use SMTP)
    notifier:
      filesystem:
        enabled: true
        filename: /config/notifications.yml

    # -- TOTP configuration
    totp:
      disable: false
      issuer: Authelia
      algorithm: SHA1
      digits: 6
      period: 30
      skew: 1

    # -- WebAuthn configuration
    webauthn:
      disable: false
      display_name: Authelia
      attestation_conveyance_preference: indirect
      user_verification: preferred
      timeout: 60s

    # -- Server configuration
    server:
      port: 9091
      path: ""
      buffers:
        read: 4096
        write: 4096
      timeouts:
        read: 6s
        write: 6s
        idle: 30s

    # -- Logging
    log:
      level: info
      format: text

    # -- Theme
    theme: light

    # -- Regulation (anti-brute-force)
    regulation:
      max_retries: 3
      find_time: 2m
      ban_time: 5m

    # -- NTP checks
    ntp:
      address: udp://time.cloudflare.com:123
      version: 4
      max_desync: 3s
      disable_startup_check: false
      disable_failure: false

    # ── OpenID Connect 1.0 Provider ──
    # Authelia sebagai OIDC provider untuk aplikasi-aplikasi
    identity_providers:
      oidc:
        # HMAC secret untuk sign JWT (gunakan secret management!)
        hmac_secret:
          secret_name: ~
          value: ""
        jwks:
          - key_id: "rsa-1"
            algorithm: RS256
            use: sig
            key: |
              -----BEGIN PRIVATE KEY-----
              # Ganti dengan RSA private key Anda
              # Generate: openssl genrsa -out rsa.2048.key 2048
              -----END PRIVATE KEY-----
        cors:
          allowed_origins_from_client_redirect_uris: true
          endpoints:
            - authorization
            - token
            - revocation
            - introspection
            - userinfo
        clients:
          # ── OAuth2-Proxy ──
          - client_id: oauth2-proxy
            client_name: OAuth2-Proxy
            client_secret: ""
            public: false
            authorization_policy: one_factor
            redirect_uris:
              - https://auth.example.com/oauth2/callback
            scopes:
              - openid
              - profile
              - email
              - groups
            grant_types:
              - authorization_code
              - refresh_token
            response_types:
              - code
            token_endpoint_auth_method: client_secret_post

          # ── Grafana ──
          - client_id: grafana
            client_name: Grafana
            client_secret: ""
            public: false
            authorization_policy: one_factor
            redirect_uris:
              - https://grafana.your-domain.com/login/generic_oauth
            scopes:
              - openid
              - profile
              - email
              - groups
            grant_types:
              - authorization_code
              - refresh_token
            response_types:
              - code
            token_endpoint_auth_method: client_secret_post

          # ── ArgoCD ──
          - client_id: argocd
            client_name: ArgoCD
            client_secret: ""
            public: false
            authorization_policy: one_factor
            redirect_uris:
              - https://argocd.your-domain.com/auth/callback
            scopes:
              - openid
              - profile
              - email
              - groups
            grant_types:
              - authorization_code
              - refresh_token
            response_types:
              - code
            token_endpoint_auth_method: client_secret_post

  # -- Persistence for config and database
  persistence:
    enabled: true
    size: 1Gi
    storageClass: ""
    accessModes:
      - ReadWriteOnce

  # -- Service configuration
  service:
    type: ClusterIP
    port: 80
    nodePort: 30091

  # -- RBAC
  rbac:
    enabled: false

  # -- Certificates
  certificates:
    annotations: {}
    labels: {}
    existingSecret: ""
    values: []
