environment: sandbox

authelia:
  # -- Minimal resource for sandbox
  pod:
    kind: Deployment
    replicas: 1
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi

  # -- Ingress for sandbox
  ingress:
    enabled: true
    className: ""
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-staging
    rulesOverride:
      - host: auth.sandbox.example.com
        paths:
          - path: /
            pathType: Prefix
    tls:
      enabled: true
      secret: authelia-tls-sandbox

  # -- Authelia configuration overrides for sandbox
  configMap:
    access_control:
      default_policy: deny
      rules:
        - domain: "auth.sandbox.example.com"
          policy: one_factor

    session:
      domain: sandbox.example.com
      cookies:
        - domain: sandbox.example.com
          authelia_url: https://auth.sandbox.example.com

    # -- File-based auth for sandbox
    authentication_backend:
      file:
        enabled: true
        path: /config/users.yml

    # -- SQLite storage for sandbox
    storage:
      local:
        enabled: true
        path: /config/db.sqlite3

    # -- Filesystem notifier for sandbox
    notifier:
      filesystem:
        enabled: true
        filename: /config/notifications.yml

    # -- Minimal regulation
    regulation:
      max_retries: 5
      find_time: 2m
      ban_time: 5m

    log:
      level: debug
      format: text

    # ── OIDC Clients untuk Sandbox ──
    identity_providers:
      oidc:
        hmac_secret:
          secret_name: ~
          value: ""
        jwks:
          - key_id: "rsa-1"
            algorithm: RS256
            use: sig
            key: |
              -----BEGIN PRIVATE KEY-----
              -----END PRIVATE KEY-----
        cors:
          allowed_origins_from_client_redirect_uris: true
          endpoints:
            - authorization
            - token
            - revocation
            - introspection
            - userinfo
        clients:
          - client_id: oauth2-proxy
            client_name: OAuth2-Proxy
            client_secret: ""
            public: false
            authorization_policy: one_factor
            redirect_uris:
              - https://auth.sandbox.example.com/oauth2/callback
            scopes:
              - openid
              - profile
              - email
              - groups
            grant_types:
              - authorization_code
              - refresh_token
            response_types:
              - code
            token_endpoint_auth_method: client_secret_post

          - client_id: grafana
            client_name: Grafana
            client_secret: ""
            public: false
            authorization_policy: one_factor
            redirect_uris:
              - https://grafana-sandbox.your-domain.com/login/generic_oauth
            scopes:
              - openid
              - profile
              - email
              - groups
            grant_types:
              - authorization_code
              - refresh_token
            response_types:
              - code
            token_endpoint_auth_method: client_secret_post

          - client_id: argocd
            client_name: ArgoCD
            client_secret: ""
            public: false
            authorization_policy: one_factor
            redirect_uris:
              - https://argocd-sandbox.your-domain.com/auth/callback
            scopes:
              - openid
              - profile
              - email
              - groups
            grant_types:
              - authorization_code
              - refresh_token
            response_types:
              - code
            token_endpoint_auth_method: client_secret_post

  # -- Persistence for sandbox
  persistence:
    enabled: true
    size: 500Mi

  # -- Service
  service:
    type: ClusterIP
    port: 80
