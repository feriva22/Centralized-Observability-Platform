environment: production

authelia:
  # -- Production-grade resources
  pod:
    kind: Deployment
    replicas: 2
    resources:
      requests:
        cpu: 250m
        memory: 256Mi
      limits:
        cpu: 1000m
        memory: 1Gi
    securityContext:
      pod: {}
      container: {}
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 5
      targetCPUUtilizationPercentage: 80

  # -- Pod disruption budget (top-level key in authelia chart)
  podDisruptionBudget:
    enabled: true
    minAvailable: 1

  # -- Ingress for production
  ingress:
    enabled: true
    className: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
    rulesOverride:
      - host: auth.example.com
        paths:
          - path: /
            pathType: Prefix
    tls:
      enabled: true
      secret: authelia-tls-prod

  # -- Authelia configuration overrides for production
  configMap:
    access_control:
      default_policy: deny
      rules:
        - domain: "example.com"
          policy: one_factor
        - domain: "admin.example.com"
          policy: two_factor

    session:
      domain: example.com
      cookies:
        - domain: example.com
          authelia_url: https://auth.example.com
      redis:
        enabled: true
        host: authelia-redis.authentication.svc.cluster.local
        port: 6379
        database_index: 0
        maximum_active_connections: 8
        minimum_idle_connections: 4
        deploy: true
        high_availability:
          enabled: false

    # -- LDAP backend for production (or file, adjust as needed)
    authentication_backend:
      ldap:
        enabled: true
        address: ldap://openldap.authentication.svc.cluster.local:389
        implementation: openldap
        base_dn: dc=example,dc=com
        users_filter: (&({username_attribute}={input})(objectClass=person))
        groups_filter: (&(member={dn})(objectClass=groupOfNames))
        user: cn=admin,dc=example,dc=com
        attributes:
          username: uid
          display_name: displayName
          mail: mail
          group_name: cn
          member_of: memberOf
        tls:
          skip_verify: false
          minimum_version: TLS1.2
          maximum_version: TLS1.3
        start_tls: false
        timeout: 5s
        permit_referrals: false
        permit_unauthenticated_bind: false
        password:
          secret_name: ~
          value: ""
      refresh_interval: 5m
      password_reset:
        disable: false
      password_change:
        disable: false

    # -- PostgreSQL storage for production
    storage:
      postgres:
        enabled: true
        address: tcp://postgres-postgresql.authentication.svc.cluster.local:5432
        database: authelia
        schema: public
        username: authelia
        password:
          secret_name: ~
          value: ""
        timeout: 5s
        deploy: true
        tls:
          enabled: false

    # -- SMTP notifier for production
    notifier:
      smtp:
        enabled: true
        address: submission://smtp.example.com:587
        sender: "Authelia <noreply@example.com>"
        identifier: localhost
        username: noreply@example.com
        password:
          secret_name: ~
          value: ""
        disable_require_tls: false
        disable_starttls: false
        disable_html_emails: false
        tls:
          skip_verify: false
          minimum_version: TLS1.2
          maximum_version: TLS1.3
        timeout: 5s

    # -- Strict regulation
    regulation:
      max_retries: 3
      find_time: 2m
      ban_time: 10m
      modes:
        - user
        - ip

    log:
      level: info
      format: json

    # -- Telemetry / Metrics
    telemetry:
      metrics:
        enabled: true
        port: 9959
        serviceMonitor:
          enabled: true

    # ── OIDC Clients untuk Production ──
    identity_providers:
      oidc:
        hmac_secret:
          secret_name: ~
          value: ""
        jwks:
          - key_id: "rsa-1"
            algorithm: RS256
            use: sig
            key: |
              -----BEGIN PRIVATE KEY-----
              -----END PRIVATE KEY-----
        cors:
          allowed_origins_from_client_redirect_uris: true
          endpoints:
            - authorization
            - token
            - revocation
            - introspection
            - userinfo
        clients:
          - client_id: oauth2-proxy
            client_name: OAuth2-Proxy
            client_secret: ""
            public: false
            authorization_policy: one_factor
            redirect_uris:
              - https://auth.example.com/oauth2/callback
            scopes:
              - openid
              - profile
              - email
              - groups
            grant_types:
              - authorization_code
              - refresh_token
            response_types:
              - code
            token_endpoint_auth_method: client_secret_post

          - client_id: grafana
            client_name: Grafana
            client_secret: ""
            public: false
            authorization_policy: two_factor
            redirect_uris:
              - https://grafana.your-domain.com/login/generic_oauth
            scopes:
              - openid
              - profile
              - email
              - groups
            grant_types:
              - authorization_code
              - refresh_token
            response_types:
              - code
            token_endpoint_auth_method: client_secret_post

          - client_id: argocd
            client_name: ArgoCD
            client_secret: ""
            public: false
            authorization_policy: two_factor
            redirect_uris:
              - https://argocd.your-domain.com/auth/callback
            scopes:
              - openid
              - profile
              - email
              - groups
            grant_types:
              - authorization_code
              - refresh_token
            response_types:
              - code
            token_endpoint_auth_method: client_secret_post

  # -- Persistence for production
  persistence:
    enabled: true
    size: 5Gi

  # -- Service
  service:
    type: ClusterIP
    port: 80

  # -- RBAC
  rbac:
    enabled: true
    serviceAccountName: authelia
