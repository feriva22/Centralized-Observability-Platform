apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: authentication-sandbox
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - component: authelia
          - component: oauth2-proxy
  template:
    metadata:
      name: "auth-sandbox-{{component}}"
      labels:
        app.kubernetes.io/part-of: authentication
        environment: sandbox
    spec:
      project: default
      source:
        repoURL: https://github.com/feriva22/Centralized-Observability-Platform
        targetRevision: HEAD
        path: "infra/k8s/authentication/{{component}}"
        helm:
          valueFiles:
            - values.yaml
            - values-sandbox.yaml
      destination:
        server: https://kubernetes.default.svc   # sandbox cluster API
        namespace: authentication
      syncPolicy:
        syncOptions:
          - CreateNamespace=true
